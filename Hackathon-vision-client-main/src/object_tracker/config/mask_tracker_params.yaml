/**:
  ros__parameters:
    # All numeric values below are initial guesses: tune them with the "Track stats" debug log (see DEBUG.md)

    # D405: color comes from the depth module and is published as image_rect_raw
    color_topic: "/camera_duck/camera/color/image_rect_raw"
    depth_topic: "/camera_duck/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera_duck/camera/color/camera_info"
    output_topic: "/object_goal_pose"
    # Output frame; camera_color_optical_frame for bench tests, map on the robot
    world_frame: "camera_color_optical_frame"

    # Mask init: mono8, same size as color, non-zero = object, header.stamp = stamp of the color frame it belongs to
    mask_topic: "/tracked_object/init_mask"
    init.cache_s: 7.0                # > vlm.timeout_s (6.0): a VLM answer takes ~3.4 s; ~1.2 MB per 848x480 frame (7 s at 30 fps ~ 260 MB)
    init.stamp_tolerance_s: 0.005    # max |mask stamp - cached frame stamp|
    init.mask_erode_px: 4            # shrink the mask before ORB features and KLT seeding
    init.min_mask_px: 400            # largest connected region must have at least this many pixels
    init.handoff_timeout_s: 2.0      # give up a candidate not found in the current frame within this time

    # ORB / matching: same values as params.yaml (orb_tracker_node), which is tuned on the real camera
    orb.n_features_model: 1000       # features extracted inside the mask (orb_tracker_node uses orb.n_features)
    orb.n_features: 1000             # ROI search
    orb.n_features_full: 5000        # full-frame search (handoff, no search anchor); busy backgrounds steal a small budget
    orb.fast_threshold: 20
    ratio_test: 0.75
    min_matches: 15                  # also the minimum number of features inside a mask
    min_inliers: 10
    ransac_reproj_thresh: 5.0        # px, similarity RANSAC

    # Gates (ORB and KLT)
    gate.min_inlier_ratio: 0.3
    gate.max_reproj_error_px: 3.0    # mean transfer error under the similarity
    gate.max_scale_ratio: 3.0        # similarity scale must be within [1/x, x]
    gate.max_scale_change: 1.2       # KLT only: scale change between successive successful frames

    # Depth
    depth_gate_m: 0.04               # mask cleaning and KLT outlier rejection around the object depth
    min_depth_points: 5              # inliers with real depth needed for a measured 3D point
    depth_min_m: 0.07                # D405 ideal range is about 7-50 cm
    depth_max_m: 0.5
    depth_fallback.enable: true      # too far (no in-range depth, not mostly too near): use value_m along the output pixel ray

    # Output point
    output.center_mode: "mask_center"  # mask_center: mask centroid moved by the similarity (stays on the object axis);
                                       # features: median of the inlier points (old; leans toward the textured side)
    output.center_depth_window: 5      # depth window at the center (max 7); used when within depth_gate_m of the
                                       # inliers' median depth, else that median is used
    depth_fallback.value_m: 0.5
    depth_fallback.max_region_area_px: 0.0  # > 0: only for regions this small (far objects look small); 0 = no check

    # Object size for the gripper, from the VLM bbox at the median object depth; one message per VLM answer
    # (not per frame), transient_local. geometry_msgs/Vector3Stamped: x = width, y = height, z = depth (m)
    size.enable: true
    size.topic: "/tracked_object/size"

    # ROI search around the last region
    roi.expand_ratio: 0.5
    roi.min_size_px: 160

    # KLT
    klt.max_points: 150              # same as params.yaml
    klt.min_points: 12               # fewer surviving points: re-detect with ORB (same as params.yaml)
    klt.refill_below: 40             # add points inside the region below this count
    klt.fb_max_px: 1.0               # max forward-backward error per point
    klt.win_size: 21
    klt.max_level: 3
    klt.region_margin_px: 10.0       # points may be this far outside the projected mask polygon

    # Without a search anchor (HOLDING longer than full_after_s, CONFIRMING, LOST)
    search.full_after_s: 0.5
    search.full_interval: 5          # full-frame ORB once every N frames, SEARCH_IDLE in between

    # TF
    tf_timeout_s: 0.05

    # Point filter
    pose_filter.enable: true
    pose_filter.alpha: 0.3
    pose_filter.max_jump_m: 0.15     # also the distance limit for hold / confirm below

    # Hold the last trusted world point on failed frames; confirm big jumps before switching
    hold.enable: true
    hold.timeout_s: 0.0              # <= 0: hold forever
    hold.confirm_frames: 3
    hold.publish: true

    # Debug
    debug.enable: true
    debug.img: true                  # publish the debug image (drawn only while someone subscribes)
    debug.image_topic: "/tracked_object/debug_image"  # image_transport: also .../compressed (JPEG) for viewing over WiFi
    debug.image_rate_hz: 5.0         # max debug image rate; 0 = every frame
    debug.window: false              # also show an OpenCV window (desktop with a display only, never on the Pi)
