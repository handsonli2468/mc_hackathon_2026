# Eval set for scripts/eval_locate.py. Images live in eval/images/.
# expect: none (target absent -> the server should answer NOT_FOUND)
#         or [x1, y1, x2, y2] in ORIGINAL image pixels (the eval rescales per upload width).
# Draft the boxes with `--propose`, check its overlays, then copy the entries here.
#
# Scenes (848x480 frames from the robot's RealSense, 5 each, captured 2026-09-20):
#   single-*      paper cup alone
#   distract-*    paper cup + plastic water bottle + black metal bottle + Pepsi can
#   decoy-*       glass cup + plastic water bottle + Pepsi can, no paper cup
#   empty-*       empty desk
# Every image is asked the same four queries, so each object is also a hard negative
# for the others (paper cup vs glass cup, plastic vs metal bottle).
#
# Example:
# - image: distract-1.png
#   queries:
#     - text: the plastic bottle
#       expect: [312, 140, 368, 300]
#     - text: the metal bottle
#       expect: [420, 150, 470, 310]
#     - text: the paper cup
#       expect: none
#
# Labelled 2026-09-20 from slow-mode --propose overlays; wrong-object answers corrected to none.
- image: decoy-1.png
  queries:
    - text: the paper cup
      expect: none
    - text: the glass cup
      expect: [436, 259, 505, 381]
    - text: the plastic water bottle
      expect: [615, 188, 721, 478]
    - text: the black metal bottle
